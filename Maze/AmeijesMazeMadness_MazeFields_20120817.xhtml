<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maze Pattern Builder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: monospace;
      background: #fff;
      color: #111;
      padding: 28px;
    }

    header { margin-bottom: 28px; }

    h1 {
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 11px;
      color: #888;
    }

    .app {
      display: flex;
      gap: 48px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 12px;
    }

    /* ======= CANVAS FIELD =======
       FIELD_TILE = 14px  -> each maze slot = 70x70px
       gap = 14px         -> one tile between slots          */
    #mazeFieldGrid {
      display: grid;
      grid-template-columns: repeat(5, 70px);
      gap: 14px;
    }

    .maze-cell {
      width: 70px;
      height: 70px;
      cursor: pointer;
      position: relative;
      background: #f0f0f0;
      outline: 2px solid transparent;
      outline-offset: 2px;
    }

    .maze-cell.selected { outline: 2px solid #000; }
    .maze-cell svg { display: block; pointer-events: none; }

    .remove-btn {
      display: none;
      position: absolute;
      top: 2px; right: 3px;
      font-size: 10px;
      font-family: monospace;
      color: #fff;
      background: #000;
      line-height: 1;
      padding: 1px 2px;
      cursor: pointer;
      z-index: 1;
    }
    .maze-cell:hover .remove-btn { display: block; }

    .field-actions { margin-top: 14px; display: flex; gap: 8px; }

    /* ======= CHOOSER =======
       Each cell is one tile (24px), cycling: grey / black / white  */
    #chooserGrid {
      display: grid;
      grid-template-columns: repeat(5, 24px);
      gap: 3px;
    }

    .chooser-cell {
      width: 24px;
      height: 24px;
      cursor: pointer;
    }
    .chooser-cell[data-state="any"] { background: #bbb; }
    .chooser-cell[data-state="in"]  { background: #000; }
    .chooser-cell[data-state="out"] { background: #fff; outline: 1px solid #ccc; }

    .match-count {
      margin-top: 12px;
      font-size: 11px;
      color: #888;
    }
    .match-count strong { color: #000; }

    .legend {
      margin-top: 10px;
      font-size: 10px;
      color: #aaa;
      line-height: 2.2;
    }

    .dot {
      display: inline-block;
      width: 10px; height: 10px;
      vertical-align: middle;
      margin-right: 5px;
    }

    .chooser-actions { margin-top: 12px; }

    /* ======= BUTTONS ======= */
    button {
      background: #fff;
      border: 1px solid #ccc;
      color: #555;
      padding: 5px 12px;
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 0.5px;
      cursor: pointer;
    }
    button:hover { background: #f5f5f5; border-color: #888; color: #000; }

    /* ======= RESULTS =======
       RESULT_TILE = 8px -> each maze = 40x40px               */
    .results-section { flex: 1; min-width: 200px; }

    #resultsGrid {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-height: 560px;
      overflow-y: auto;
    }

    .result-maze {
      width: 40px;
      height: 40px;
      cursor: pointer;
      flex-shrink: 0;
      outline: 2px solid transparent;
      outline-offset: 1px;
    }
    .result-maze:hover { outline: 2px solid #000; }
    .result-maze.placed { outline: 2px solid #000; }
    .result-maze svg { display: block; pointer-events: none; }

    .no-matches { color: #bbb; font-size: 11px; padding: 12px 0; }
  </style>
</head>
<body>
  <script src="mazes_5x5.js"></script>

  <header>
    <h1>Maze Pattern Builder</h1>
    <p class="subtitle">
      1. Select a cell in the canvas &#160;&#8594;&#160;
      2. Set a filter pattern &#160;&#8594;&#160;
      3. Click a matching maze to place it
    </p>
  </header>

  <div class="app">
    <!-- CANVAS -->
    <div>
      <div class="section-label">Canvas (5&#215;5)</div>
      <div id="mazeFieldGrid"></div>
      <div class="field-actions">
        <button onclick="clearSelectedCell()">Clear cell</button>
        <button onclick="clearAllCells()">Clear all</button>
      </div>
    </div>

    <!-- FILTER -->
    <div>
      <div class="section-label">Filter pattern</div>
      <div id="chooserGrid"></div>
      <div class="match-count">Matching: <strong id="matchCount">0</strong></div>
      <div class="legend">
        <div><span class="dot" style="background:#bbb"></span>grey – any</div>
        <div><span class="dot" style="background:#000"></span>black – cell IN</div>
        <div><span class="dot" style="background:#fff;outline:1px solid #ccc"></span>white – cell OUT</div>
      </div>
      <div class="chooser-actions">
        <button onclick="clearChooser()">Reset filter</button>
      </div>
    </div>

    <!-- RESULTS -->
    <div class="results-section">
      <div class="section-label">Matching mazes – click to place</div>
      <div id="resultsGrid"></div>
    </div>
  </div>

  <script>//<![CDATA[
    var FIELD_TILE  = 14;  // px per tile in the canvas
    var RESULT_TILE = 8;   // px per tile in the results panel
    var N = 5;

    var selectedRow = 0, selectedCol = 0;
    var fieldMazes = {};   // "r_c" -> mazeString

    // ---- Tile SVG factory ----
    function makeTileSvg(mazeString, tileSize) {
      var ns  = 'http://www.w3.org/2000/svg';
      var sz  = 5 * tileSize;
      var svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('width',   sz);
      svg.setAttribute('height',  sz);
      svg.setAttribute('viewBox', '0 0 ' + sz + ' ' + sz);

      for (var i = 0; i < 25; i++) {
        var row  = Math.floor(i / 5);
        var col  = i % 5;
        var rect = document.createElementNS(ns, 'rect');
        rect.setAttribute('x',      col * tileSize);
        rect.setAttribute('y',      row * tileSize);
        rect.setAttribute('width',  tileSize);
        rect.setAttribute('height', tileSize);
        rect.setAttribute('fill',   mazeString[i] === '1' ? '#000' : '#fff');
        svg.appendChild(rect);
      }
      return svg;
    }

    // ---- Canvas field ----
    function initField() {
      var grid = document.getElementById('mazeFieldGrid');
      for (var r = 0; r < N; r++) {
        for (var c = 0; c < N; c++) {
          var cell = document.createElement('div');
          cell.className = 'maze-cell';
          cell.id = 'field_' + r + '_' + c;

          var rm = document.createElement('div');
          rm.className = 'remove-btn';
          rm.textContent = 'x';
          rm.setAttribute('data-r', r);
          rm.setAttribute('data-c', c);
          rm.addEventListener('click', function(e) {
            e.stopPropagation();
            clearCell(+this.getAttribute('data-r'), +this.getAttribute('data-c'));
          });
          cell.appendChild(rm);

          cell.setAttribute('data-r', r);
          cell.setAttribute('data-c', c);
          cell.addEventListener('click', function() {
            selectCell(+this.getAttribute('data-r'), +this.getAttribute('data-c'));
          });
          grid.appendChild(cell);
        }
      }
      selectCell(0, 0);
    }

    function selectCell(r, c) {
      var prev = document.getElementById('field_' + selectedRow + '_' + selectedCol);
      if (prev) prev.classList.remove('selected');
      selectedRow = r;
      selectedCol = c;
      var cell = document.getElementById('field_' + r + '_' + c);
      if (cell) cell.classList.add('selected');
    }

    function renderCell(r, c) {
      var cell = document.getElementById('field_' + r + '_' + c);
      var old  = cell.querySelector('svg');
      if (old) cell.removeChild(old);
      var key = r + '_' + c;
      if (fieldMazes[key]) {
        cell.insertBefore(makeTileSvg(fieldMazes[key], FIELD_TILE), cell.firstChild);
      }
    }

    function placeInSelected(mazeString) {
      fieldMazes[selectedRow + '_' + selectedCol] = mazeString;
      renderCell(selectedRow, selectedCol);
      advanceSelection();
    }

    function advanceSelection() {
      for (var r = 0; r < N; r++) {
        for (var c = 0; c < N; c++) {
          if (!fieldMazes[r + '_' + c] && !(r === selectedRow && c === selectedCol)) {
            selectCell(r, c);
            return;
          }
        }
      }
    }

    function clearCell(r, c) {
      delete fieldMazes[r + '_' + c];
      renderCell(r, c);
    }

    function clearSelectedCell() { clearCell(selectedRow, selectedCol); }

    function clearAllCells() {
      fieldMazes = {};
      for (var r = 0; r < N; r++)
        for (var c = 0; c < N; c++)
          renderCell(r, c);
    }

    // ---- Filter chooser ----
    var STATES = ['any', 'in', 'out'];

    function initChooser() {
      var grid = document.getElementById('chooserGrid');
      for (var r = 0; r < N; r++) {
        for (var c = 0; c < N; c++) {
          var cell = document.createElement('div');
          cell.className = 'chooser-cell';
          cell.id = 'ch_' + r + '_' + c;
          cell.setAttribute('data-state', 'any');
          cell.addEventListener('click', function() {
            var s = this.getAttribute('data-state');
            this.setAttribute('data-state', STATES[(STATES.indexOf(s) + 1) % 3]);
            updateResults();
          });
          grid.appendChild(cell);
        }
      }
    }

    function clearChooser() {
      for (var r = 0; r < N; r++)
        for (var c = 0; c < N; c++)
          document.getElementById('ch_' + r + '_' + c).setAttribute('data-state', 'any');
      updateResults();
    }

    function getMatchingMazes() {
      var mask = '';
      for (var r = 0; r < N; r++)
        for (var c = 0; c < N; c++) {
          var s = document.getElementById('ch_' + r + '_' + c).getAttribute('data-state');
          mask += s === 'in' ? '1' : s === 'out' ? '0' : 'x';
        }

      var all  = getAllMazeNames();
      var hits = [];
      for (var i = 0; i < all.length; i++) {
        var maze = all[i], ok = true;
        for (var j = 0; j < 25; j++) {
          if (mask[j] !== 'x' && mask[j] !== maze[j]) { ok = false; break; }
        }
        if (ok) hits.push(maze);
      }
      return hits;
    }

    // ---- Results ----
    function updateResults() {
      var matches = getMatchingMazes();
      document.getElementById('matchCount').textContent = matches.length;
      var grid = document.getElementById('resultsGrid');
      grid.innerHTML = '';

      if (!matches.length) {
        var msg = document.createElement('div');
        msg.className = 'no-matches';
        msg.textContent = 'No mazes match this pattern.';
        grid.appendChild(msg);
        return;
      }

      for (var i = 0; i < matches.length; i++) {
        (function(ms) {
          var item = document.createElement('div');
          item.className = 'result-maze';
          item.appendChild(makeTileSvg(ms, RESULT_TILE));
          item.addEventListener('click', function() {
            placeInSelected(ms);
            item.classList.add('placed');
            setTimeout(function() { item.classList.remove('placed'); }, 400);
          });
          grid.appendChild(item);
        })(matches[i]);
      }
    }

    initField();
    initChooser();
    updateResults();
  //]]></script>
</body>
</html>
