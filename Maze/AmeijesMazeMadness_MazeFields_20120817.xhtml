<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maze Pattern Builder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #111118;
      color: #ccc;
      min-height: 100vh;
      padding: 28px;
    }

    header { margin-bottom: 28px; }

    h1 {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #7ec8e3;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: #555;
    }

    .app {
      display: flex;
      gap: 40px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #444;
      margin-bottom: 14px;
    }

    /* ======= MAZE FIELD ======= */
    #mazeFieldGrid {
      display: grid;
      grid-template-columns: repeat(5, 68px);
      gap: 4px;
    }

    .maze-cell {
      width: 68px;
      height: 68px;
      border: 2px solid #252535;
      border-radius: 5px;
      cursor: pointer;
      background: #1a1a28;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: border-color 0.12s;
    }

    .maze-cell:hover { border-color: #3a3a55; }
    .maze-cell.selected { border-color: #e94560; box-shadow: 0 0 0 2px #e9456030; }
    .maze-cell svg { pointer-events: none; display: block; }

    .remove-btn {
      display: none;
      position: absolute;
      top: 3px; right: 5px;
      font-size: 10px;
      color: #e94560;
      cursor: pointer;
      z-index: 1;
      line-height: 1;
    }
    .maze-cell:hover .remove-btn { display: block; }

    .field-actions { margin-top: 12px; display: flex; gap: 8px; }

    /* ======= CHOOSER ======= */
    #chooserGrid {
      display: grid;
      grid-template-columns: repeat(5, 40px);
      gap: 4px;
    }

    .chooser-cell {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.1s;
    }
    .chooser-cell:hover { opacity: 0.75; }
    .chooser-cell[data-state="any"] { background: #252535; border: 2px solid #333345; }
    .chooser-cell[data-state="in"]  { background: #7ec8e3; border: 2px solid #7ec8e3; }
    .chooser-cell[data-state="out"] { background: #111118; border: 2px solid #3a3a55; }

    .match-count {
      margin-top: 12px;
      font-size: 13px;
      color: #555;
    }
    .match-count strong { color: #7ec8e3; }

    .legend {
      margin-top: 10px;
      font-size: 11px;
      color: #444;
      line-height: 2.2;
    }

    .dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 2px;
      vertical-align: middle;
      margin-right: 5px;
    }

    .chooser-actions { margin-top: 12px; }

    /* ======= BUTTONS ======= */
    button {
      background: #1e1e2e;
      border: 1px solid #333;
      color: #888;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 11px;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    button:hover { background: #252535; color: #ccc; border-color: #555; }

    /* ======= RESULTS ======= */
    .results-section { flex: 1; min-width: 220px; }

    #resultsGrid {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      max-height: 560px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .result-maze {
      width: 52px;
      height: 52px;
      border: 2px solid #252535;
      border-radius: 4px;
      cursor: pointer;
      background: #1a1a28;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.12s, background 0.12s;
    }
    .result-maze:hover { border-color: #7ec8e3; background: #1e1e35; }
    .result-maze.placed { border-color: #e94560; }
    .result-maze svg { pointer-events: none; display: block; }

    #resultsGrid::-webkit-scrollbar { width: 4px; }
    #resultsGrid::-webkit-scrollbar-track { background: transparent; }
    #resultsGrid::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .no-matches { color: #444; font-size: 13px; padding: 16px 0; }
  </style>
</head>
<body>
  <script src="mazes_5x5.js"></script>

  <header>
    <h1>Maze Pattern Builder</h1>
    <p class="subtitle">
      1. Select a cell in the canvas &#160;→&#160;
      2. Draw a filter pattern &#160;→&#160;
      3. Click a matching maze to place it
    </p>
  </header>

  <div class="app">
    <!-- CANVAS / MAZE FIELD -->
    <div>
      <div class="section-label">Canvas (5×5)</div>
      <div id="mazeFieldGrid"></div>
      <div class="field-actions">
        <button onclick="clearSelectedCell()">Clear cell</button>
        <button onclick="clearAllCells()">Clear all</button>
      </div>
    </div>

    <!-- FILTER CHOOSER -->
    <div>
      <div class="section-label">Filter pattern</div>
      <div id="chooserGrid"></div>
      <div class="match-count">Matching: <strong id="matchCount">0</strong></div>
      <div class="legend">
        <div><span class="dot" style="background:#252535;border:1px solid #3a3a55"></span>grey – any</div>
        <div><span class="dot" style="background:#7ec8e3"></span>blue – cell IN</div>
        <div><span class="dot" style="background:#111118;border:1px solid #3a3a55"></span>dark – cell OUT</div>
      </div>
      <div class="chooser-actions">
        <button onclick="clearChooser()">Reset filter</button>
      </div>
    </div>

    <!-- MATCHING MAZES -->
    <div class="results-section">
      <div class="section-label">Matching mazes — click to place in selected cell</div>
      <div id="resultsGrid"></div>
    </div>
  </div>

  <script>//<![CDATA[
    var MAZE_SCALE = 12;  // coordinate scale for viewBox (path coords go 0..6*scale)
    var FIELD_SIZE = 60;  // display px for canvas cell SVG
    var RESULT_SIZE = 44; // display px for result SVG
    var N = 5;

    var selectedRow = 0, selectedCol = 0;
    var fieldMazes = {};  // "r_c" -> mazeString

    // ---- SVG factory ----
    function makeSvg(mazeString, displaySize, strokeColor) {
      var ns = 'http://www.w3.org/2000/svg';
      var vb = MAZE_SCALE * 6;
      var svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('width', displaySize);
      svg.setAttribute('height', displaySize);
      svg.setAttribute('viewBox', '0 0 ' + vb + ' ' + vb);

      var path = document.createElementNS(ns, 'path');
      path.setAttribute('d', getSVGPathFromMazeName(mazeString, MAZE_SCALE, MAZE_SCALE));
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', strokeColor || '#7ec8e3');
      path.setAttribute('stroke-width', MAZE_SCALE * 0.45);
      path.setAttribute('stroke-linejoin', 'round');
      path.setAttribute('stroke-linecap', 'round');
      svg.appendChild(path);
      return svg;
    }

    // ---- Canvas field ----
    function initField() {
      var grid = document.getElementById('mazeFieldGrid');
      for (var r = 0; r < N; r++) {
        for (var c = 0; c < N; c++) {
          var cell = document.createElement('div');
          cell.className = 'maze-cell';
          cell.id = 'field_' + r + '_' + c;

          var rm = document.createElement('div');
          rm.className = 'remove-btn';
          rm.textContent = '✕';
          rm.setAttribute('data-r', r);
          rm.setAttribute('data-c', c);
          rm.addEventListener('click', function(e) {
            e.stopPropagation();
            clearCell(+this.getAttribute('data-r'), +this.getAttribute('data-c'));
          });
          cell.appendChild(rm);

          cell.setAttribute('data-r', r);
          cell.setAttribute('data-c', c);
          cell.addEventListener('click', function() {
            selectCell(+this.getAttribute('data-r'), +this.getAttribute('data-c'));
          });
          grid.appendChild(cell);
        }
      }
      selectCell(0, 0);
    }

    function selectCell(r, c) {
      var prev = document.getElementById('field_' + selectedRow + '_' + selectedCol);
      if (prev) prev.classList.remove('selected');
      selectedRow = r;
      selectedCol = c;
      var cell = document.getElementById('field_' + r + '_' + c);
      if (cell) cell.classList.add('selected');
    }

    function renderCell(r, c) {
      var cell = document.getElementById('field_' + r + '_' + c);
      var old = cell.querySelector('svg');
      if (old) cell.removeChild(old);
      var key = r + '_' + c;
      if (fieldMazes[key]) {
        cell.insertBefore(makeSvg(fieldMazes[key], FIELD_SIZE, '#7ec8e3'), cell.firstChild);
      }
    }

    function placeInSelected(mazeString) {
      fieldMazes[selectedRow + '_' + selectedCol] = mazeString;
      renderCell(selectedRow, selectedCol);
      advanceSelection();
    }

    // After placing, move to the next empty cell (left-to-right, top-to-bottom)
    function advanceSelection() {
      for (var r = 0; r < N; r++) {
        for (var c = 0; c < N; c++) {
          if (!fieldMazes[r + '_' + c] && !(r === selectedRow && c === selectedCol)) {
            selectCell(r, c);
            return;
          }
        }
      }
    }

    function clearCell(r, c) {
      delete fieldMazes[r + '_' + c];
      renderCell(r, c);
    }

    function clearSelectedCell() { clearCell(selectedRow, selectedCol); }

    function clearAllCells() {
      fieldMazes = {};
      for (var r = 0; r < N; r++)
        for (var c = 0; c < N; c++)
          renderCell(r, c);
    }

    // ---- Filter chooser ----
    var STATES = ['any', 'in', 'out'];

    function initChooser() {
      var grid = document.getElementById('chooserGrid');
      for (var r = 0; r < N; r++) {
        for (var c = 0; c < N; c++) {
          var cell = document.createElement('div');
          cell.className = 'chooser-cell';
          cell.id = 'ch_' + r + '_' + c;
          cell.setAttribute('data-state', 'any');
          cell.addEventListener('click', function() {
            var s = this.getAttribute('data-state');
            this.setAttribute('data-state', STATES[(STATES.indexOf(s) + 1) % 3]);
            updateResults();
          });
          grid.appendChild(cell);
        }
      }
    }

    function clearChooser() {
      for (var r = 0; r < N; r++)
        for (var c = 0; c < N; c++)
          document.getElementById('ch_' + r + '_' + c).setAttribute('data-state', 'any');
      updateResults();
    }

    function getMatchingMazes() {
      var mask = '';
      for (var r = 0; r < N; r++)
        for (var c = 0; c < N; c++) {
          var s = document.getElementById('ch_' + r + '_' + c).getAttribute('data-state');
          mask += s === 'in' ? '1' : s === 'out' ? '0' : 'x';
        }

      var all = getAllMazeNames();
      var hits = [];
      for (var i = 0; i < all.length; i++) {
        var maze = all[i], ok = true;
        for (var j = 0; j < 25; j++) {
          if (mask[j] !== 'x' && mask[j] !== maze[j]) { ok = false; break; }
        }
        if (ok) hits.push(maze);
      }
      return hits;
    }

    // ---- Results ----
    function updateResults() {
      var matches = getMatchingMazes();
      document.getElementById('matchCount').textContent = matches.length;
      var grid = document.getElementById('resultsGrid');
      grid.innerHTML = '';

      if (!matches.length) {
        var msg = document.createElement('div');
        msg.className = 'no-matches';
        msg.textContent = 'No mazes match this pattern.';
        grid.appendChild(msg);
        return;
      }

      for (var i = 0; i < matches.length; i++) {
        (function(ms) {
          var item = document.createElement('div');
          item.className = 'result-maze';
          item.appendChild(makeSvg(ms, RESULT_SIZE, '#888'));
          item.addEventListener('click', function() {
            placeInSelected(ms);
            item.classList.add('placed');
            setTimeout(function() { item.classList.remove('placed'); }, 400);
          });
          grid.appendChild(item);
        })(matches[i]);
      }
    }

    initField();
    initChooser();
    updateResults();
  //]]></script>
</body>
</html>
