<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maze Pattern Builder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: monospace;
      background: #fff;
      color: #111;
      padding: 28px;
    }

    header { margin-bottom: 28px; }

    h1 {
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 11px;
      color: #888;
    }

    .app {
      display: flex;
      gap: 48px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 12px;
    }

    /* ======= CANVAS FIELD =======
       FIELD_TILE = 14px  -> each maze slot = 70x70px
       gap = 14px         -> one tile between slots          */
    #mazeFieldGrid {
      display: grid;
      grid-template-columns: repeat(5, 70px);
      gap: 14px;
    }

    .maze-cell {
      width: 70px;
      height: 70px;
      cursor: pointer;
      position: relative;
      background: #f0f0f0;
      outline: 2px solid transparent;
      outline-offset: 2px;
    }

    .maze-cell.selected { outline: 2px solid #000; }
    .maze-cell svg { display: block; pointer-events: none; }

    .remove-btn {
      display: none;
      position: absolute;
      top: 2px; right: 3px;
      font-size: 10px;
      font-family: monospace;
      color: #fff;
      background: #000;
      line-height: 1;
      padding: 1px 2px;
      cursor: pointer;
      z-index: 1;
    }
    .maze-cell:hover .remove-btn { display: block; }

    .field-actions { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }

    .sym-toggle {
      margin-top: 10px;
      font-size: 11px;
      color: #888;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .sym-toggle input { margin-right: 4px; cursor: pointer; }
    .sym-toggle label { cursor: pointer; white-space: nowrap; }

    /* ======= CHOOSER =======
       Each cell is one tile (24px), cycling: grey / black / white  */
    #chooserGrid {
      display: grid;
      grid-template-columns: repeat(5, 24px);
      gap: 3px;
    }

    .chooser-cell {
      width: 24px;
      height: 24px;
      cursor: pointer;
    }
    .chooser-cell[data-state="any"] { background: #bbb; }
    .chooser-cell[data-state="in"]  { background: #000; }
    .chooser-cell[data-state="out"] { background: #fff; outline: 1px solid #ccc; }

    .match-count {
      margin-top: 12px;
      font-size: 11px;
      color: #888;
    }
    .match-count strong { color: #000; }

    .legend {
      margin-top: 10px;
      font-size: 10px;
      color: #aaa;
      line-height: 2.2;
    }

    .dot {
      display: inline-block;
      width: 10px; height: 10px;
      vertical-align: middle;
      margin-right: 5px;
    }

    .chooser-actions { margin-top: 12px; }

    /* ======= BUTTONS ======= */
    button {
      background: #fff;
      border: 1px solid #ccc;
      color: #555;
      padding: 5px 12px;
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 0.5px;
      cursor: pointer;
    }
    button:hover { background: #f5f5f5; border-color: #888; color: #000; }

    /* ======= RESULTS =======
       RESULT_TILE = 8px -> each maze = 40x40px               */
    .results-section { flex: 1; min-width: 200px; }

    #resultsGrid {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-height: 560px;
      overflow-y: auto;
    }

    .result-maze {
      width: 40px;
      height: 40px;
      cursor: pointer;
      flex-shrink: 0;
      outline: 2px solid transparent;
      outline-offset: 1px;
    }
    .result-maze:hover { outline: 2px solid #000; }
    .result-maze.placed { outline: 2px solid #000; }
    .result-maze svg { display: block; pointer-events: none; }

    .no-matches { color: #bbb; font-size: 11px; padding: 12px 0; }
  </style>
</head>
<body>
  <script src="mazes_5x5.js"></script>

  <header>
    <h1>Maze Pattern Builder</h1>
    <p class="subtitle">
      1. Select a cell in the canvas &#160;&#8594;&#160;
      2. Set a filter pattern &#160;&#8594;&#160;
      3. Click a matching maze to place it
    </p>
  </header>

  <div class="app">
    <!-- CANVAS -->
    <div>
      <div class="section-label">Canvas (5&#215;5)</div>
      <div id="mazeFieldGrid"></div>
      <div class="field-actions">
        <button onclick="fillCanvas()">Fill randomly</button>
        <button onclick="fillSymmetric()">Fill symmetric</button>
        <button onclick="clearSelectedCell()">Clear cell</button>
        <button onclick="clearAllCells()">Clear all</button>
      </div>
      <div class="sym-toggle">
        <label>
          <input type="checkbox" id="symOnly" onchange="updateResults()" />
          self-symmetric mazes only
        </label>
      </div>
      <div class="sym-toggle">
        <label>
          <input type="checkbox" id="canvasSym" />
          canvas symmetric (H + V mirror)
        </label>
      </div>
      <div class="sym-toggle">
        <label>
          <input type="checkbox" id="canvasDiagSym" />
          canvas D4-symmetric (+ diagonal axes)
        </label>
      </div>
      <div class="sym-toggle">
        <label>
          <input type="checkbox" id="useFilter" />
          fill from filtered patterns only
        </label>
      </div>
    </div>

    <!-- FILTER -->
    <div>
      <div class="section-label">Filter pattern</div>
      <div id="chooserGrid"></div>
      <div class="match-count">Matching: <strong id="matchCount">0</strong></div>
      <div class="legend">
        <div><span class="dot" style="background:#bbb"></span>grey – any</div>
        <div><span class="dot" style="background:#000"></span>black – cell IN</div>
        <div><span class="dot" style="background:#fff;outline:1px solid #ccc"></span>white – cell OUT</div>
      </div>
      <div class="sym-toggle">
        <label><input type="checkbox" id="filterH"  onchange="updateResults()" /> H-symmetric</label>
        <label><input type="checkbox" id="filterV"  onchange="updateResults()" /> V-symmetric</label>
        <label><input type="checkbox" id="filterD2" onchange="updateResults()" /> D2-symmetric</label>
      </div>
      <div class="chooser-actions">
        <button onclick="clearChooser()">Reset filter</button>
      </div>
    </div>

    <!-- RESULTS -->
    <div class="results-section">
      <div class="section-label">Matching mazes – click to place</div>
      <div id="resultsGrid"></div>
    </div>
  </div>

  <script>//<![CDATA[
    var FIELD_TILE  = 14;  // px per tile in the canvas
    var RESULT_TILE = 8;   // px per tile in the results panel
    var N = 5;

    var selectedRow = 0, selectedCol = 0;
    var fieldMazes = {};   // "r_c" -> mazeString

    // ---- Tile SVG factory ----
    function makeTileSvg(mazeString, tileSize) {
      var ns  = 'http://www.w3.org/2000/svg';
      var sz  = 5 * tileSize;
      var svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('width',   sz);
      svg.setAttribute('height',  sz);
      svg.setAttribute('viewBox', '0 0 ' + sz + ' ' + sz);

      for (var i = 0; i < 25; i++) {
        var row  = Math.floor(i / 5);
        var col  = i % 5;
        var rect = document.createElementNS(ns, 'rect');
        rect.setAttribute('x',      col * tileSize);
        rect.setAttribute('y',      row * tileSize);
        rect.setAttribute('width',  tileSize);
        rect.setAttribute('height', tileSize);
        rect.setAttribute('fill',   mazeString[i] === '1' ? '#000' : '#fff');
        svg.appendChild(rect);
      }
      return svg;
    }

    // ---- Maze transforms ----
    function rotateMaze90CW(ms) {
      var result = '';
      for (var r = 0; r < 5; r++)
        for (var c = 0; c < 5; c++)
          result += ms[(4-c)*5 + r];
      return result;
    }

    function mirrorMazeH(ms) {  // flip left-right
      var result = '';
      for (var r = 0; r < 5; r++)
        for (var c = 0; c < 5; c++)
          result += ms[r*5 + (4-c)];
      return result;
    }

    function mirrorMazeV(ms) {  // flip top-bottom
      var result = '';
      for (var r = 0; r < 5; r++)
        for (var c = 0; c < 5; c++)
          result += ms[(4-r)*5 + c];
      return result;
    }

    function mirrorMazeDiag(ms) {  // reflect along main diagonal: (r,c) <- (c,r)
      var result = '';
      for (var r = 0; r < 5; r++)
        for (var c = 0; c < 5; c++)
          result += ms[c*5 + r];
      return result;
    }

    function mirrorMazeAntiDiag(ms) {  // reflect along anti-diagonal: (r,c) <- (4-c,4-r)
      var result = '';
      for (var r = 0; r < 5; r++)
        for (var c = 0; c < 5; c++)
          result += ms[(4-c)*5 + (4-r)];
      return result;
    }

    function isSelfSymmetric(ms) {
      var r90  = rotateMaze90CW(ms);
      var r180 = rotateMaze90CW(r90);
      return ms === r90 || ms === r180 || ms === mirrorMazeH(ms) || ms === mirrorMazeV(ms);
    }

    // Pre-computed pools (lazy)
    var _symPool = null, _hPool = null, _vPool = null, _d2Pool = null, _diagPool = null, _d4Pool = null;

    function getSymmetricPool() {
      if (_symPool) return _symPool;
      _symPool = getAllMazeNames().filter(isSelfSymmetric);
      return _symPool;
    }
    // H-symmetric: invariant under left-right flip
    function getHSymPool() {
      if (_hPool) return _hPool;
      _hPool = getAllMazeNames().filter(function(ms) { return ms === mirrorMazeH(ms); });
      return _hPool;
    }
    // V-symmetric: invariant under top-bottom flip
    function getVSymPool() {
      if (_vPool) return _vPool;
      _vPool = getAllMazeNames().filter(function(ms) { return ms === mirrorMazeV(ms); });
      return _vPool;
    }
    // D2-symmetric: invariant under both H and V (and therefore also 180° rotation)
    function getD2SymPool() {
      if (_d2Pool) return _d2Pool;
      _d2Pool = getAllMazeNames().filter(function(ms) {
        return ms === mirrorMazeH(ms) && ms === mirrorMazeV(ms);
      });
      return _d2Pool;
    }
    // Diag-symmetric: invariant under main-diagonal reflection
    function getDiagSymPool() {
      if (_diagPool) return _diagPool;
      _diagPool = getAllMazeNames().filter(function(ms) { return ms === mirrorMazeDiag(ms); });
      return _diagPool;
    }
    // D4-symmetric: invariant under the full dihedral group (H + diag suffice as generators)
    function getD4SymPool() {
      if (_d4Pool) return _d4Pool;
      _d4Pool = getAllMazeNames().filter(function(ms) {
        return ms === mirrorMazeH(ms) && ms === mirrorMazeDiag(ms);
      });
      return _d4Pool;
    }

    function checked(id) {
      var el = document.getElementById(id);
      return !!(el && el.checked);
    }

    function getMask() {
      var mask = '';
      for (var r = 0; r < N; r++)
        for (var c = 0; c < N; c++) {
          var s = document.getElementById('ch_' + r + '_' + c).getAttribute('data-state');
          mask += s === 'in' ? '1' : s === 'out' ? '0' : 'x';
        }
      return mask;
    }

    function applyMask(pool, mask) {
      return pool.filter(function(maze) {
        for (var j = 0; j < 25; j++)
          if (mask[j] !== 'x' && mask[j] !== maze[j]) return false;
        return true;
      });
    }

    // Pool from symmetry checkboxes only (no pattern mask).
    function getBasePool() {
      if (checked('filterD2') || (checked('filterH') && checked('filterV'))) return getD2SymPool();
      if (checked('filterH'))  return getHSymPool();
      if (checked('filterV'))  return getVSymPool();
      if (checked('symOnly'))  return getSymmetricPool();
      return getAllMazeNames();
    }

    // Pool used by fill operations — optionally also restricted to the filter pattern.
    function getPool() {
      var pool = getBasePool();
      if (checked('useFilter')) pool = applyMask(pool, getMask());
      return pool;
    }


    // ---- Fill helpers ----

    function applyTransform(ms, xf) {
      if (xf === 'H')   return mirrorMazeH(ms);
      if (xf === 'V')   return mirrorMazeV(ms);
      if (xf === 'HV')  return mirrorMazeH(mirrorMazeV(ms));
      if (xf === 'r90') return rotateMaze90CW(ms);
      if (xf === 'r180') { var t = rotateMaze90CW(ms); return rotateMaze90CW(t); }
      if (xf === 'r270') { var t = rotateMaze90CW(ms); t = rotateMaze90CW(t); return rotateMaze90CW(t); }
      if (xf === 'diag')  return mirrorMazeDiag(ms);
      if (xf === 'adiag') return mirrorMazeAntiDiag(ms);
      return ms; // 'id'
    }

    // 4-fold rotational canvas orbits (CW order -> id/r90/r180/r270)
    var ORBITS_ROT = [
      { cells: [[2,2]],                         xfs: ['id']                      },
      { cells: [[0,0],[0,4],[4,4],[4,0]],        xfs: ['id','r90','r180','r270']  },
      { cells: [[0,2],[2,4],[4,2],[2,0]],        xfs: ['id','r90','r180','r270']  },
      { cells: [[0,1],[1,4],[4,3],[3,0]],        xfs: ['id','r90','r180','r270']  },
      { cells: [[0,3],[3,4],[4,1],[1,0]],        xfs: ['id','r90','r180','r270']  },
      { cells: [[1,1],[1,3],[3,3],[3,1]],        xfs: ['id','r90','r180','r270']  },
      { cells: [[1,2],[2,3],[3,2],[2,1]],        xfs: ['id','r90','r180','r270']  }
    ];

    // H+V mirror canvas orbits.
    // pool: constraint the BASE maze must satisfy when canvas-sym is active:
    //   'any' = unconstrained          (off-axis quads)
    //   'H'   = mirrorMazeH(ms)===ms   (cell sits on vertical mirror axis, col 2)
    //   'V'   = mirrorMazeV(ms)===ms   (cell sits on horizontal mirror axis, row 2)
    //   'D2'  = both H and V           (center (2,2) sits on both axes)
    var ORBITS_HV = [
      { cells: [[2,2]],                   xfs: ['id'],              pool: 'D2'  },
      { cells: [[2,0],[2,4]],             xfs: ['id','H'],          pool: 'V'   },
      { cells: [[0,2],[4,2]],             xfs: ['id','V'],          pool: 'H'   },
      { cells: [[1,2],[3,2]],             xfs: ['id','V'],          pool: 'H'   },
      { cells: [[2,1],[2,3]],             xfs: ['id','H'],          pool: 'V'   },
      { cells: [[0,0],[0,4],[4,0],[4,4]], xfs: ['id','H','V','HV'], pool: 'any' },
      { cells: [[0,1],[0,3],[4,1],[4,3]], xfs: ['id','H','V','HV'], pool: 'any' },
      { cells: [[1,0],[1,4],[3,0],[3,4]], xfs: ['id','H','V','HV'], pool: 'any' },
      { cells: [[1,1],[1,3],[3,1],[3,3]], xfs: ['id','H','V','HV'], pool: 'any' }
    ];

    // D4 canvas orbits (full dihedral: rotations + H/V/diagonal reflections).
    // pool constraint on the base maze per orbit:
    //   'D4'   = invariant under all 8 D4 operations  (center)
    //   'H'    = H-symmetric (mid-edge orbits on rotation axes)
    //   'diag' = diag-symmetric (corner orbits on diagonal axes)
    //   'any'  = unconstrained (generic 8-cell orbit)
    var ORBITS_D4 = [
      { cells: [[2,2]],                                                                    xfs: ['id'],                                                    pool: 'D4'   },
      { cells: [[0,2],[2,4],[4,2],[2,0]],                                                  xfs: ['id','r90','r180','r270'],                                 pool: 'H'    },
      { cells: [[0,0],[0,4],[4,4],[4,0]],                                                  xfs: ['id','H','r180','V'],                                      pool: 'diag' },
      { cells: [[1,2],[2,3],[3,2],[2,1]],                                                  xfs: ['id','r90','r180','r270'],                                 pool: 'H'    },
      { cells: [[1,1],[1,3],[3,3],[3,1]],                                                  xfs: ['id','H','r180','V'],                                      pool: 'diag' },
      { cells: [[0,1],[1,4],[4,3],[3,0],[0,3],[4,1],[1,0],[3,4]], xfs: ['id','r90','r180','r270','H','V','diag','adiag'], pool: 'any'  }
    ];

    function poolForOrbit(p) {
      if (p === 'H')    return getHSymPool();
      if (p === 'V')    return getVSymPool();
      if (p === 'D2')   return getD2SymPool();
      if (p === 'diag') return getDiagSymPool();
      if (p === 'D4')   return getD4SymPool();
      return getPool(); // 'any' — respects symOnly checkbox
    }

    function fillWithOrbits(orbits) {
      for (var o = 0; o < orbits.length; o++) {
        var orbit = orbits[o];
        var pool  = orbit.pool ? poolForOrbit(orbit.pool) : getPool();
        if (!pool.length) pool = getPool();
        if (!pool.length) pool = getAllMazeNames();
        var base  = pool[Math.floor(Math.random() * pool.length)];
        for (var i = 0; i < orbit.cells.length; i++) {
          var r = orbit.cells[i][0], c = orbit.cells[i][1];
          fieldMazes[r + '_' + c] = applyTransform(base, orbit.xfs[i]);
          renderCell(r, c);
        }
      }
    }

    function canvasSymChecked() {
      var el = document.getElementById('canvasSym');
      return el && el.checked;
    }

    function canvasDiagSymChecked() {
      var el = document.getElementById('canvasDiagSym');
      return el && el.checked;
    }

    function fillSymmetric() {
      if (canvasDiagSymChecked()) fillWithOrbits(ORBITS_D4);
      else if (canvasSymChecked()) fillWithOrbits(ORBITS_HV);
      else fillWithOrbits(ORBITS_ROT);
    }

    function fillCanvas() {
      if (canvasDiagSymChecked()) {
        fillWithOrbits(ORBITS_D4);
      } else if (canvasSymChecked()) {
        fillWithOrbits(ORBITS_HV);
      } else {
        var all = getPool();
        for (var r = 0; r < N; r++)
          for (var c = 0; c < N; c++) {
            fieldMazes[r + '_' + c] = all[Math.floor(Math.random() * all.length)];
            renderCell(r, c);
          }
      }
    }


    function initField() {
      var grid = document.getElementById('mazeFieldGrid');
      for (var r = 0; r < N; r++) {
        for (var c = 0; c < N; c++) {
          var cell = document.createElement('div');
          cell.className = 'maze-cell';
          cell.id = 'field_' + r + '_' + c;

          var rm = document.createElement('div');
          rm.className = 'remove-btn';
          rm.textContent = 'x';
          rm.setAttribute('data-r', r);
          rm.setAttribute('data-c', c);
          rm.addEventListener('click', function(e) {
            e.stopPropagation();
            clearCell(+this.getAttribute('data-r'), +this.getAttribute('data-c'));
          });
          cell.appendChild(rm);

          cell.setAttribute('data-r', r);
          cell.setAttribute('data-c', c);
          cell.addEventListener('click', function() {
            selectCell(+this.getAttribute('data-r'), +this.getAttribute('data-c'));
          });
          grid.appendChild(cell);
        }
      }
      selectCell(0, 0);
    }

    function selectCell(r, c) {
      var prev = document.getElementById('field_' + selectedRow + '_' + selectedCol);
      if (prev) prev.classList.remove('selected');
      selectedRow = r;
      selectedCol = c;
      var cell = document.getElementById('field_' + r + '_' + c);
      if (cell) cell.classList.add('selected');
    }

    function renderCell(r, c) {
      var cell = document.getElementById('field_' + r + '_' + c);
      var old  = cell.querySelector('svg');
      if (old) cell.removeChild(old);
      var key = r + '_' + c;
      if (fieldMazes[key]) {
        cell.insertBefore(makeTileSvg(fieldMazes[key], FIELD_TILE), cell.firstChild);
      }
    }

    function placeInSelected(mazeString) {
      fieldMazes[selectedRow + '_' + selectedCol] = mazeString;
      renderCell(selectedRow, selectedCol);
      advanceSelection();
    }

    function advanceSelection() {
      for (var r = 0; r < N; r++) {
        for (var c = 0; c < N; c++) {
          if (!fieldMazes[r + '_' + c] && !(r === selectedRow && c === selectedCol)) {
            selectCell(r, c);
            return;
          }
        }
      }
    }

    function clearCell(r, c) {
      delete fieldMazes[r + '_' + c];
      renderCell(r, c);
    }

    function clearSelectedCell() { clearCell(selectedRow, selectedCol); }

    function clearAllCells() {
      fieldMazes = {};
      for (var r = 0; r < N; r++)
        for (var c = 0; c < N; c++)
          renderCell(r, c);
    }

    // ---- Filter chooser ----
    var STATES = ['any', 'in', 'out'];

    function initChooser() {
      var grid = document.getElementById('chooserGrid');
      for (var r = 0; r < N; r++) {
        for (var c = 0; c < N; c++) {
          var cell = document.createElement('div');
          cell.className = 'chooser-cell';
          cell.id = 'ch_' + r + '_' + c;
          cell.setAttribute('data-state', 'any');
          cell.addEventListener('mouseenter', function() {
            var s = this.getAttribute('data-state');
            this.setAttribute('data-state', STATES[(STATES.indexOf(s) + 1) % 3]);
            updateResults();
          });
          grid.appendChild(cell);
        }
      }
    }

    function clearChooser() {
      for (var r = 0; r < N; r++)
        for (var c = 0; c < N; c++)
          document.getElementById('ch_' + r + '_' + c).setAttribute('data-state', 'any');
      updateResults();
    }

    function getMatchingMazes() {
      return applyMask(getBasePool(), getMask());
    }

    // ---- Results ----
    function updateResults() {
      var matches = getMatchingMazes();
      document.getElementById('matchCount').textContent = matches.length;
      var grid = document.getElementById('resultsGrid');
      grid.innerHTML = '';

      if (!matches.length) {
        var msg = document.createElement('div');
        msg.className = 'no-matches';
        msg.textContent = 'No mazes match this pattern.';
        grid.appendChild(msg);
        return;
      }

      for (var i = 0; i < matches.length; i++) {
        (function(ms) {
          var item = document.createElement('div');
          item.className = 'result-maze';
          item.appendChild(makeTileSvg(ms, RESULT_TILE));
          item.addEventListener('click', function() {
            placeInSelected(ms);
            item.classList.add('placed');
            setTimeout(function() { item.classList.remove('placed'); }, 400);
          });
          grid.appendChild(item);
        })(matches[i]);
      }
    }

    initField();
    initChooser();
    updateResults();
  //]]></script>
</body>
</html>
