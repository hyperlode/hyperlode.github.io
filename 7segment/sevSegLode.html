<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Segment Painter</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.0.2/jquery.min.js"></script>
  <script src="sevSegClickable.js"></script>
  <script src="saveSvgAsPng.js"></script>
  <script src="svgOperations.js"></script>
  <script src="domFunctions.js"></script>
  <script src="fifteenSeg.js"></script>
  <script src="sevSeg.js"></script>
  <script src="circle.js"></script>
</head>
<body>

<div id="app">

  <nav id="sidebar">

    <div id="logo">Segment Painter</div>

    <div class="section">
      <div class="section-label">Shape</div>
      <div class="chip-group" data-for="shapeModeBootstrap">
        <button class="chip active" data-value="sevSeg">7-Seg</button>
        <button class="chip" data-value="fifteenSeg">15-Seg</button>
        <button class="chip" data-value="circle">Dots</button>
      </div>
    </div>

    <div class="section">
      <div class="section-label">Interact</div>
      <div class="chip-group" data-for="segmentToggleTriggerBootstrap">
        <button class="chip active" data-value="hover">Hover</button>
        <button class="chip" data-value="click">Click</button>
      </div>
    </div>

    <div class="section">
      <div class="section-label">Affect</div>
      <div class="chip-group" data-for="digitChangeModeBootstrap">
        <button class="chip active" data-value="single">Single</button>
        <button class="chip" data-value="row">Row</button>
        <button class="chip" data-value="column">Col</button>
        <button class="chip" data-value="cross">Cross</button>
        <button class="chip" data-value="all">All</button>
      </div>
    </div>

    <div class="section">
      <div class="section-label">Paint</div>
      <div class="chip-group" data-for="segmentChangeModeBootstrap">
        <button class="chip active" data-value="toggle">Toggle</button>
        <button class="chip" data-value="on">On</button>
        <button class="chip" data-value="off">Off</button>
      </div>
    </div>

    <div class="section">
      <div class="section-label">Theme</div>
      <div class="chip-group">
        <button class="chip theme-chip active" data-theme="amber" onclick="setTheme('amber')"><span class="swatch" style="background:#e8910a"></span>Amber</button>
        <button class="chip theme-chip" data-theme="red" onclick="setTheme('red')"><span class="swatch" style="background:#cc1111"></span>Red</button>
      </div>
      <div class="color-row">
        <label class="color-label"><input type="color" id="color-bg"  value="#0d0d0d"><span>BG</span></label>
        <label class="color-label"><input type="color" id="color-on"  value="#e8910a"><span>On</span></label>
        <label class="color-label"><input type="color" id="color-off" value="#1e1e1e"><span>Off</span></label>
      </div>
    </div>

    <div class="divider"></div>

    <div class="section">
      <div class="section-label">Reset</div>
      <div class="chip-group">
        <button class="chip" onclick="digit_changeAll_AllSegments(false)">All Off</button>
        <button class="chip" onclick="digit_changeAll_AllSegments(true)">All On</button>
        <button class="chip" onclick="digit_changeAll_SingleSegment('P',false)">· Off</button>
        <button class="chip" onclick="digit_changeAll_SingleSegment('P',true)">· On</button>
      </div>
    </div>

    <div class="section">
      <div class="section-label">Grid</div>
      <div class="grid-row">
        <input type="number" id="input_field_rows" value="5" min="1" max="50" title="Rows">
        <span class="dim">×</span>
        <input type="number" id="input_field_columns" value="24" min="1" max="50" title="Columns">
        <button class="chip" onclick="digits_redefineQuantity()">Apply</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="section">
      <div class="section-label">Text / Data</div>
      <textarea id="textArea_imageAsText" rows="4" placeholder="Type text or paste export data…"></textarea>
      <div class="chip-group">
        <button class="chip" onclick="importString()">Text →</button>
        <button class="chip" onclick="exportImage()">Export</button>
        <button class="chip" onclick="importImage()">Import</button>
      </div>
    </div>

    <div class="divider"></div>

    <button id="buttonSaveAsPng" class="save-btn">↓ Save PNG</button>

  </nav>

  <main id="canvas-wrap">
    <div id="drawing"></div>
  </main>

</div>

<!-- Hidden selects — existing JS reads values from these -->
<select id="shapeModeBootstrap" hidden>
  <option value="sevSeg" selected>7-Seg</option>
  <option value="fifteenSeg">15-Seg</option>
  <option value="circle">Dots</option>
</select>
<select id="segmentToggleTriggerBootstrap" hidden>
  <option value="hover" selected>Hover</option>
  <option value="click">Click</option>
</select>
<select id="digitChangeModeBootstrap" hidden>
  <option value="single" selected>Single</option>
  <option value="row">Row</option>
  <option value="column">Column</option>
  <option value="cross">Cross</option>
  <option value="all">All</option>
</select>
<select id="segmentChangeModeBootstrap" hidden>
  <option value="toggle" selected>Toggle</option>
  <option value="on">On</option>
  <option value="off">Off</option>
</select>

<script>
  var THEMES = {
    amber: { fill: '#e8910a', empty: '#1e1e1e', stroke: '#0d0d0d', bg: '#0d0d0d' },
    red:   { fill: '#cc1111', empty: '#e8e8e8', stroke: '#ffffff', bg: '#ffffff' }
  };

  function applyColors(fill, empty, bg) {
    var stroke = bg;
    FILL_COLOUR = fill; EMPTY_COLOUR = empty; STROKE_COLOUR = stroke; SVG_BACKGROUND = bg;
    document.documentElement.style.setProperty('--seg-on',  fill);
    document.documentElement.style.setProperty('--seg-off', empty);
    document.documentElement.style.setProperty('--bg',      bg);
    document.querySelectorAll('[data-rel]').forEach(function(el) {
      el.setAttribute('fill',   el.getAttribute('data-rel') === 'true' ? fill : empty);
      el.setAttribute('stroke', stroke);
    });
    var svg = document.getElementById(SVG_ID);
    if (svg) svg.style.background = bg;
    document.getElementById('canvas-wrap').style.background = bg;
  }

  function setTheme(name) {
    var t = THEMES[name];
    applyColors(t.fill, t.empty, t.bg);
    document.getElementById('color-bg').value  = t.bg;
    document.getElementById('color-on').value  = t.fill;
    document.getElementById('color-off').value = t.empty;
    document.body.setAttribute('data-theme', name);
    document.querySelectorAll('.theme-chip').forEach(function(c) {
      c.classList.toggle('active', c.getAttribute('data-theme') === name);
    });
  }

  // Colour pickers — live update without changing active theme chip
  document.getElementById('color-bg').addEventListener('input', function() {
    var bg = this.value;
    SVG_BACKGROUND = bg; STROKE_COLOUR = bg;
    document.documentElement.style.setProperty('--bg', bg);
    var svg = document.getElementById(SVG_ID);
    if (svg) svg.style.background = bg;
    document.getElementById('canvas-wrap').style.background = bg;
    document.querySelectorAll('[data-rel]').forEach(function(el) { el.setAttribute('stroke', bg); });
  });
  document.getElementById('color-on').addEventListener('input', function() {
    FILL_COLOUR = this.value;
    document.documentElement.style.setProperty('--seg-on', this.value);
    document.querySelectorAll('[data-rel="true"]').forEach(function(el) { el.setAttribute('fill', FILL_COLOUR); });
  });
  document.getElementById('color-off').addEventListener('input', function() {
    EMPTY_COLOUR = this.value;
    document.documentElement.style.setProperty('--seg-off', this.value);
    document.querySelectorAll('[data-rel="false"]').forEach(function(el) { el.setAttribute('fill', EMPTY_COLOUR); });
  });

  // Wire visible chip groups to hidden selects
  document.querySelectorAll('.chip-group[data-for]').forEach(function(group) {
    var selectId = group.getAttribute('data-for');
    var select = document.getElementById(selectId);
    group.querySelectorAll('.chip').forEach(function(btn) {
      btn.addEventListener('click', function() {
        group.querySelectorAll('.chip').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        select.value = btn.getAttribute('data-value');
        if (selectId === 'shapeModeBootstrap') {
          shape_deleteAll();
          NUMBER_OF_CHARACTERS_ON_LINE = parseInt(document.getElementById('input_field_columns').value) || 24;
          NUMBER_OF_LINES = parseInt(document.getElementById('input_field_rows').value) || 5;
          svgPopulate();
        }
      });
    });
  });
</script>

</body>
</html>
